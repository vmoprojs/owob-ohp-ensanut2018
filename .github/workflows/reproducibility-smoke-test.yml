name: Public reproducibility smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-reproduction:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Public aggregate reproduction and testthat
        run: Rscript run_all.R --public

